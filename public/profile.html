<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | CampusKart</title>
<meta name="description" content="Manage your CampusKart profile, view account statistics, and update your details.">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">
  <div class="nav-belt">

    <div class="nav-logo">
      <a href="index.html">
        <h1>Campus<span>Kart</span></h1>
      </a>
    </div>

    <div style="margin-left:auto">
      <a href="index.html" class="nav-link-item">
        Back to Store
      </a>
    </div>

  </div>
</header>

<div class="main-container">

  <div class="profile-card">

    <h1>My Profile</h1>

    <div id="profile-info">
      Loading...
    </div>

    <hr style="margin:30px 0; border: none; border-top: 1px solid var(--color-border);">

    <div id="profile-stats">

      <h2 style="font-family: 'Outfit', sans-serif; font-weight: 700;">Account Statistics</h2>

      <div style="
        display:flex;
        gap:20px;
        flex-wrap:wrap;
        margin-top:20px;
      ">

        <div class="stat-box">
          <h3 id="orders-count">0</h3>
          <p>Orders</p>
        </div>

        <div class="stat-box">
          <h3 id="wishlist-count">0</h3>
          <p>Wishlist</p>
        </div>

        <div class="stat-box">
          <h3 id="cart-count-profile">0</h3>
          <p>Cart Items</p>
        </div>

      </div>

    </div>

    <hr style="margin:30px 0; border: none; border-top: 1px solid var(--color-border);">

    <h2 style="font-family: 'Outfit', sans-serif; font-weight: 700;">Edit Profile</h2>

    <form id="profile-form">

      <input
        type="text"
        id="edit-name"
        placeholder="Username"
        style="width:100%;padding:12px 16px;margin:10px 0;border:1.5px solid var(--color-border);border-radius:var(--border-radius-sm);font-family:inherit;font-size:14px;outline:none;"
      >

      <input
        type="email"
        id="edit-email"
        placeholder="Email"
        style="width:100%;padding:12px 16px;margin:10px 0;border:1.5px solid var(--color-border);border-radius:var(--border-radius-sm);font-family:inherit;font-size:14px;outline:none;"
      >

      <button
        type="submit"
        style="padding:12px 28px;border:none;border-radius:50px;background:linear-gradient(135deg,#00d4aa,#7c3aed);color:white;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;font-size:14px;margin-top:8px;"
      >
        Update Profile
      </button>

    </form>

  </div>

</div>

<div style="max-width:620px;margin:0 auto 40px;padding:0 24px;">

<hr style="margin:30px 0; border: none; border-top: 1px solid var(--color-border);">

<div class="profile-card" style="margin-top:0;">

<h2 style="font-family: 'Outfit', sans-serif; font-weight: 700;">Change Password</h2>

<form id="password-form">

  <input
    type="password"
    id="current-password"
    placeholder="Current Password"
    style="width:100%;padding:12px 16px;margin:10px 0;border:1.5px solid var(--color-border);border-radius:var(--border-radius-sm);font-family:inherit;font-size:14px;outline:none;"
    required
  >

  <input
    type="password"
    id="new-password"
    placeholder="New Password"
    style="width:100%;padding:12px 16px;margin:10px 0;border:1.5px solid var(--color-border);border-radius:var(--border-radius-sm);font-family:inherit;font-size:14px;outline:none;"
    required
  >

  <input
    type="password"
    id="confirm-password"
    placeholder="Confirm New Password"
    style="width:100%;padding:12px 16px;margin:10px 0;border:1.5px solid var(--color-border);border-radius:var(--border-radius-sm);font-family:inherit;font-size:14px;outline:none;"
    required
  >

  <button
    type="submit"
    style="padding:12px 28px;border:none;border-radius:50px;background:linear-gradient(135deg,#00d4aa,#7c3aed);color:white;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;font-size:14px;margin-top:8px;"
  >
    Change Password
  </button>

</form>

</div>

</div>

<script src="profile.js"></script>

</body>
</html>
