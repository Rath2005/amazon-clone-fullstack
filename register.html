<!DOCTYPE html>
<html>
<head>
    <title>Amazon Register</title>

    <style>

        body{
            background:#131921;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            width:300px;
            border-radius:10px;
        }

        h1{
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:#febd69;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        a{
            color:blue;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="box">

<h1>Create Account</h1>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="register()">Register</button>

<p>
Already have account?
<a href="login.html">Login</a>
</p>

</div>

<script>

function register(){

    let email = document.getElementById("email").value;

    let password = document.getElementById("password").value;

    if(email == "" || password == ""){

        alert("Fill all fields");
        return;
    }

    localStorage.setItem("amazonEmail", email);

    localStorage.setItem("amazonPassword", password);

    alert("Registration Successful");

    window.location.href = "login.html";
}

</script>

</body>
</html>
